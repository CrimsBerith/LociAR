name: LociAR
attributes:
  LastUpgradeCheck: "2600"
  LastSwiftUpdateCheck: "2600"
options:
  bundleIdPrefix: com.khankartal
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Catalog keys are Turkish source texts; several differ only by case or punctuation, which
    # would collide as generated symbols. Nothing uses the symbols.
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    GCC_C_LANGUAGE_STANDARD: gnu17
    DEAD_CODE_STRIPPING: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.19.0
  ARCore:
    url: https://github.com/google-ar/arcore-ios-sdk.git
    from: 1.56.0
targets:
  LociAR:
    type: application
    platform: iOS
    sources:
      - path: LociAR
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khankartal.lociar
        PRODUCT_NAME: LociAR
        INFOPLIST_FILE: LociAR/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: LociAR
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        CODE_SIGN_ENTITLEMENTS: LociAR/Resources/LociAR.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZSRUTGX74S
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        # The Crashlytics symbol upload phase reads Swift package files outside its declared inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        OTHER_LDFLAGS: $(inherited) -ObjC
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
      - package: ARCore
        product: ARCoreGARSession
      - package: ARCore
        product: ARCoreGeospatial
      - package: ARCore
        product: ARCoreCloudAnchors
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: MapKit.framework
      - sdk: AuthenticationServices.framework
      - sdk: libsqlite3.tbd
    postBuildScripts:
      # Crashlytics needs the dSYMs to symbolicate crash reports. Release (archive) builds only; the
      # app has no GoogleService-Info.plist, so the Firebase app id comes from the xcconfig.
      - name: Upload Crashlytics symbols
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then exit 0; fi
          if [ -z "${LOCIAR_FIREBASE_GOOGLE_APP_ID}" ]; then
            echo "warning: LOCIAR_FIREBASE_GOOGLE_APP_ID is empty (Config/Local.xcconfig); dSYMs not uploaded to Crashlytics."
            exit 0
          fi
          UPLOAD="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
          if [ ! -x "${UPLOAD}" ]; then
            echo "warning: Crashlytics upload-symbols not found at ${UPLOAD}; dSYMs not uploaded."
            exit 0
          fi
          "${UPLOAD}" -ai "${LOCIAR_FIREBASE_GOOGLE_APP_ID}" -p ios "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}" \
            || echo "warning: Crashlytics dSYM upload failed; upload them later from the archive (Xcode Organizer)."
    scheme:
      testTargets:
        - LociARTests
        - LociARUITests
      gatherCoverageData: true
  LociARTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LociARTests
    dependencies:
      - target: LociAR
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZSRUTGX74S
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  LociARUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LociARUITests
    dependencies:
      - target: LociAR
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZSRUTGX74S
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
