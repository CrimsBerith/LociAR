name: LociAR
attributes:
  LastUpgradeCheck: "2600"
  LastSwiftUpdateCheck: "2600"
options:
  bundleIdPrefix: com.khankartal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    GCC_C_LANGUAGE_STANDARD: gnu17
    DEAD_CODE_STRIPPING: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.19.0
  ARCore:
    url: https://github.com/google-ar/arcore-ios-sdk.git
    from: 1.56.0
targets:
  LociAR:
    type: application
    platform: iOS
    sources:
      - path: LociAR
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khankartal.lociar
        PRODUCT_NAME: LociAR
        INFOPLIST_FILE: LociAR/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: LociAR
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        CODE_SIGN_ENTITLEMENTS: LociAR/Resources/LociAR.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZSRUTGX74S
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        OTHER_LDFLAGS: $(inherited) -ObjC
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: ARCore
        product: ARCoreGARSession
      - package: ARCore
        product: ARCoreGeospatial
      - package: ARCore
        product: ARCoreCloudAnchors
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: MapKit.framework
      - sdk: AuthenticationServices.framework
      - sdk: libsqlite3.tbd
    scheme:
      testTargets:
        - LociARTests
        - LociARUITests
      gatherCoverageData: true
  LociARTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LociARTests
    dependencies:
      - target: LociAR
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZSRUTGX74S
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  LociARUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LociARUITests
    dependencies:
      - target: LociAR
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZSRUTGX74S
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
