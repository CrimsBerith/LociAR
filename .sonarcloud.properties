# SonarQube Cloud automatic analysis scope. Automatic analysis reads only this file, and only from
# the default branch; it ignores sonar-project.properties, so the exclusions below were not applied
# while they lived there. Project key and organization are set in the SonarQube Cloud UI.
# Test code, test harnesses and generated build output are not production code.
sonar.exclusions=admin/artifacts/**,**/*.test.mjs,LociAR.xcodeproj/**,**/node_modules/**,functions/lib/**,functions/test/**,admin/tests/**,admin/e2e/**,scripts/test/**,LociARTests/**,LociARUITests/**
# admin/lib/content-moderation.ts mirrors functions/src/moderation.ts on purpose: the admin panel and the
# Cloud Functions must refuse the same text, and functions/test/moderation.test.mjs runs both copies on the
# same cases. Duplication detection skips the mirror; the parity test is the guard instead.
sonar.cpd.exclusions=admin/lib/content-moderation.ts
# Intended weak hashes (reviewed 14 Nov 2026): UUIDv5 is defined over SHA-1 (RFC 9562) and derives a public
# id; the AsyncStorage importer only locates React Native's MD5-named legacy files. Swift ignores NOSONAR.
sonar.issue.ignore.multicriteria=uuidv5,asyncstorage
sonar.issue.ignore.multicriteria.uuidv5.ruleKey=swift:S4790
sonar.issue.ignore.multicriteria.uuidv5.resourceKey=LociAR/Data/FirebaseBackend.swift
sonar.issue.ignore.multicriteria.asyncstorage.ruleKey=swift:S4790
sonar.issue.ignore.multicriteria.asyncstorage.resourceKey=LociAR/Data/LegacyAsyncStorageImporter.swift
