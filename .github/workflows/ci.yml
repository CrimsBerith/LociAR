name: CI

on:
  # PR branches run through pull_request only; listing them under push too ran every job twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/test/*.test.mjs
      - run: bash scripts/qa-secret-scan.sh
      - run: node scripts/check-localization.mjs --release
      - run: python3 scripts/l10n/build_catalog.py --check
      - run: python3 scripts/store-metadata/build.py --check

  functions:
    name: Functions (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node ../scripts/check-dependency-audit.mjs functions

  rules:
    name: Security Rules + callable and admin integration (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:rules
      - run: npm run test:emulator
      - run: npm ci --prefix ../admin --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: admin
      - run: npm --prefix ../admin run build:ci
      - run: npm --prefix ../admin run test:emulator

  admin:
    name: Admin (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-lociar
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node ../scripts/check-dependency-audit.mjs admin

  admin-browser:
    name: Admin public security (desktop + mobile Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    env:
      ADMIN_E2E_PUBLIC_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build:ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-browser-results
          path: admin/artifacts/
          retention-days: 7

  ios:
    name: iOS simulator (Swift 6 + native tests + English/RTL UI)
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: |
            build/ci-ios/*.log
            build/ci-ios/*.txt
            build/ci-ios/*.json
            build/ci-ios/*.xcresult/
          retention-days: 7
