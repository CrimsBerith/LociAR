name: Scheduled dependency audit

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: "${{ matrix.package }} dependency audit"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [functions, admin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "${{ matrix.package }}/package-lock.json"
      - run: npm ci --no-audit --no-fund
        working-directory: "${{ matrix.package }}"
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: "${{ matrix.package }}"
      - run: node scripts/check-dependency-audit.mjs "$PACKAGE"
        env:
          PACKAGE: ${{ matrix.package }}
