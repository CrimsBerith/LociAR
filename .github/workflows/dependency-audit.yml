name: Scheduled dependency audit

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: "${{ matrix.package }} dependency audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [functions, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "${{ matrix.package }}/package-lock.json"
      - run: npm ci --no-audit --no-fund
        working-directory: "${{ matrix.package }}"
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: "${{ matrix.package }}"
      - run: node scripts/check-dependency-audit.mjs "${{ matrix.package }}"
